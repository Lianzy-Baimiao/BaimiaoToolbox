<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820"><title>白描工具箱 浅色工作台界面示意</title><rect width="1120" height="820" fill="#f5f7fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="20" y="20" width="1080" height="740" rx="7" fill="#f5f7fa" stroke="#d5dfe6"/><rect x="20" y="90" width="210" height="670" rx="7" fill="#eaf0f3" stroke="#d5dfe6"/><text x="44" y="64" font-size="24" fill="#172b36">白描工具箱</text><text x="206" y="63" font-size="12" fill="#607480">BAIMIAO TOOLBOX / 1.8.3</text><rect x="872" y="38" width="116" height="32" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="890" y="60" font-size="14" fill="#172b36">切换为深色</text><rect x="1000" y="38" width="76" height="32" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="1023" y="60" font-size="14" fill="#172b36">关闭</text><text x="44" y="134" font-size="16" fill="#172b36">冒险者的随身工具</text><text x="44" y="162" font-size="12" fill="#607480">清晰、有序、恰到好处。</text><text x="48" y="227" font-size="15" fill="#172b36">工作台总览</text><text x="48" y="280" font-size="15" fill="#172b36">坐标喊话</text><text x="48" y="333" font-size="15" fill="#172b36">快捷按钮</text><text x="48" y="386" font-size="15" fill="#172b36">光环 / 宠物提示器</text><rect x="34" y="412" width="182" height="42" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="48" y="439" font-size="15" fill="#008a71">嗜血 / 战复监控</text><text x="48" y="492" font-size="15" fill="#172b36">循环提示助手</text><text x="44" y="668" font-size="13" fill="#607480">/bm 打开工具箱</text><text x="44" y="695" font-size="13" fill="#607480">拖动顶栏移动窗口</text><text x="44" y="722" font-size="13" fill="#607480">Esc 关闭</text><text x="258" y="126" font-size="11" fill="#008a71">MODULE SETTINGS</text><text x="258" y="164" font-size="28" fill="#172b36">嗜血 / 战复监控</text><rect x="918" y="133" width="150" height="34" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="941" y="156" font-size="15" fill="#008a71">模块已启用</text><text x="258" y="210" font-size="15" fill="#607480">显示场景与音乐分开配置。</text><rect x="258" y="232" width="174" height="38" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="278" y="257" font-size="15" fill="#008a71">显示与场景</text><rect x="444" y="232" width="174" height="38" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="464" y="257" font-size="15" fill="#172b36">音乐与试听</text><rect x="630" y="232" width="174" height="38" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="650" y="257" font-size="15" fill="#172b36">循环与自定义</text><rect x="264" y="267" width="162" height="3" fill="#008a71"/><rect x="258" y="292" width="810" height="188" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="280" y="324" font-size="18" fill="#008a71">显示</text><rect x="280" y="345" width="20" height="20" rx="7" fill="#008a71" stroke="#d5dfe6"/><text x="284" y="361" font-size="15" fill="#ffffff">✓</text><text x="314" y="363" font-size="16" fill="#172b36">显示嗜血行</text><rect x="280" y="383" width="20" height="20" rx="7" fill="#008a71" stroke="#d5dfe6"/><text x="284" y="399" font-size="15" fill="#ffffff">✓</text><text x="314" y="401" font-size="16" fill="#172b36">显示战复行</text><text x="280" y="448" font-size="14" fill="#607480">两行分别开关；仅显示一行时自动收紧布局。</text><rect x="258" y="500" width="810" height="168" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="280" y="534" font-size="18" fill="#008a71">在哪些情况下显示</text><rect x="280" y="562" width="20" height="20" rx="7" fill="#008a71" stroke="#d5dfe6"/><text x="284" y="578" font-size="15" fill="#ffffff">✓</text><text x="314" y="579" font-size="16" fill="#172b36">单人时显示</text><rect x="525" y="562" width="20" height="20" rx="7" fill="#008a71" stroke="#d5dfe6"/><text x="529" y="578" font-size="15" fill="#ffffff">✓</text><text x="559" y="579" font-size="16" fill="#172b36">小队时显示</text><rect x="770" y="562" width="20" height="20" rx="7" fill="#008a71" stroke="#d5dfe6"/><text x="774" y="578" font-size="15" fill="#ffffff">✓</text><text x="804" y="579" font-size="16" fill="#172b36">团队时显示</text><text x="280" y="632" font-size="14" fill="#607480">音乐播放、声