<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820"><title>白描工具箱 首页工作台总览示意</title><rect width="1120" height="820" fill="#f5f7fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="20" y="20" width="1080" height="740" rx="7" fill="#f5f7fa" stroke="#d5dfe6"/><rect x="20" y="90" width="210" height="670" rx="7" fill="#eaf0f3" stroke="#d5dfe6"/><text x="44" y="64" font-size="24" fill="#172b36">白描工具箱</text><text x="206" y="63" font-size="12" fill="#607480">BAIMIAO TOOLBOX / 1.8.3</text><rect x="872" y="38" width="116" height="32" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="890" y="60" font-size="14" fill="#172b36">切换为深色</text><rect x="1000" y="38" width="76" height="32" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="1023" y="60" font-size="14" fill="#172b36">关闭</text><text x="44" y="134" font-size="16" fill="#172b36">冒险者的随身工具</text><text x="44" y="162" font-size="12" fill="#607480">清晰、有序、恰到好处。</text><text x="48" y="227" font-size="15" fill="#008a71">工作台总览</text><text x="48" y="280" font-size="15" fill="#172b36">坐标喊话</text><text x="48" y="333" font-size="15" fill="#172b36">快捷按钮</text><text x="48" y="386" font-size="15" fill="#172b36">光环 / 宠物提示器</text><rect x="34" y="200" width="182" height="42" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="48" y="439" font-size="15" fill="#172b36">嗜血 / 战复监控</text><text x="48" y="492" font-size="15" fill="#172b36">循环提示助手</text><text x="44" y="668" font-size="13" fill="#607480">/bm 打开工具箱</text><text x="44" y="695" font-size="13" fill="#607480">拖动顶栏移动窗口</text><text x="44" y="722" font-size="13" fill="#607480">Esc 关闭</text><text x="258" y="126" font-size="11" fill="#008a71">WORKSPACE / OVERVIEW</text><text x="258" y="164" font-size="28" fill="#172b36">旅程，从容开始。</text><rect x="258" y="194" width="810" height="116" rx="7" fill="#eaf0f3" stroke="#d5dfe6"/><text x="280" y="221" font-size="11" fill="#008a71">BAIMIAO / FIELD NOTES</text><text x="280" y="258" font-size="24" fill="#172b36">少一点繁琐，多一点冒险。</text><text x="280" y="288" font-size="14" fill="#607480">轻量工具，自由组合。一个属于你的游戏工作台。</text><text x="258" y="345" font-size="18" fill="#172b36">我的工具</text><text x="930" y="345" font-size="14" fill="#607480">5 个模块已启用</text><rect x="258" y="360" width="397" height="102" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="274" y="385" font-size="17" fill="#172b36">坐标喊话</text><text x="561" y="385" font-size="12" fill="#008a71">已启用</text><text x="274" y="410" font-size="13" fill="#607480">位置与移动状态，一键分享。</text><rect x="274" y="425" width="66" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="293" y="443" font-size="12" fill="#172b36">关闭</text><rect x="541" y="425" width="98" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="562" y="443" font-size="12" fill="#172b36">打开设置</text><rect x="671" y="360" width="397" height="102" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="687" y="385" font-size="17" fill="#172b36">快捷按钮</text><text x="974" y="385" font-size="12" fill="#008a71">已启用</text><text x="687" y="410" font-size="13" fill="#607480">坐骑与常用操作，随手可达。</text><rect x="687" y="425" width="66" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="706" y="443" font-size="12" fill="#172b36">关闭</text><rect x="954" y="425" width="98" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="975" y="443" font-size="12" fill="#172b36">打开设置</text><rect x="258" y="472" width="397" height="102" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="274" y="497" font-size="17" fill="#172b36">光环 / 宠物提示器</text><text x="561" y="497" font-size="12" fill="#008a71">已启用</text><text x="274" y="522" font-size="13" fill="#607480">关键准备事项，及时提醒。</text><rect x="274" y="537" width="66" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="293" y="555" font-size="12" fill="#172b36">关闭</text><rect x="541" y="537" width="98" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="562" y="555" font-size="12" fill="#172b36">打开设置</text><rect x="671" y="472" width="397" height="102" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="687" y="497" font-size="17" fill="#172b36">嗜血 / 战复监控</text><text x="974" y="497" font-size="12" fill="#008a71">已启用</text><text x="687" y="522" font-size="13" fill="#607480">团队关键状态，清晰呈现。</text><rect x="687" y="537" width="66" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="706" y="555" font-size="12" fill="#172b36">关闭</text><rect x="954" y="537" width="98" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="975" y="555" font-size="12" fill="#172b36">打开设置</text><rect x="258" y="584" width="397" height="102" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="274" y="609" font-size="17" fill="#172b36">循环提示助手</text><text x="561" y="609" font-size="12" fill="#008a71">已启用</text><text x="274" y="634" font-size="13" fill="#607480">按专精配置技能顺序与冷却提示。</text><rect x="274" y="649" width="66" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="293" y="667" font-size="12" fill="#172b36">关闭</text><rect x="541" y="649" width="98" height="26" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="562" y="667" font-size="12" fill="#172b36">打开设置</text><rect x="258" y="710" width="170" height="30" rx="7" fill="#ffffff" stroke="#d5dfe6"/><text x="274" y="731" font-size="14" fill="#172b36">小地图按钮：显示</text><text x="710" y="731" font-size="13" fill="#607480">Alt + 右键屏上工具可直达设置</text><text x="28" y="795" font-size="14" fill="#607480">首页界面示意 · 根据 v1.8.3 功能绘制，非游戏实拍；实际排版以游戏内为准。</text><text x="48" y="227" font-size="15" fill="#008a71">工作台总览</text></g></svg>