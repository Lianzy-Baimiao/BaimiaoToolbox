<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820"><title>白描工具箱 深色工作台界面示意</title><rect width="1120" height="820" fill="#101a22"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="20" y="20" width="1080" height="740" rx="7" fill="#101a22" stroke="#304550"/><rect x="20" y="90" width="210" height="670" rx="7" fill="#14212b" stroke="#304550"/><text x="44" y="64" font-size="24" fill="#edf5f7">白描工具箱</text><text x="206" y="63" font-size="12" fill="#9eb2bf">BAIMIAO TOOLBOX / 1.8.3</text><rect x="872" y="38" width="116" height="32" rx="7" fill="#1b2b36" stroke="#304550"/><text x="890" y="60" font-size="14" fill="#edf5f7">切换为浅色</text><rect x="1000" y="38" width="76" height="32" rx="7" fill="#1b2b36" stroke="#304550"/><text x="1023" y="60" font-size="14" fill="#edf5f7">关闭</text><text x="44" y="134" font-size="16" fill="#edf5f7">冒险者的随身工具</text><text x="44" y="162" font-size="12" fill="#9eb2bf">清晰、有序、恰到好处。</text><text x="48" y="227" font-size="15" fill="#edf5f7">工作台总览</text><text x="48" y="280" font-size="15" fill="#edf5f7">坐标喊话</text><rect x="34" y="306" width="182" height="42" rx="7" fill="#1b2b36" stroke="#304550"/><text x="48" y="333" font-size="15" fill="#32d6b0">快捷按钮</text><text x="48" y="386" font-size="15" fill="#edf5f7">光环 / 宠物提示器</text><text x="48" y="439" font-size="15" fill="#edf5f7">嗜血 / 战复监控</text><text x="48" y="492" font-size="15" fill="#edf5f7">循环提示助手</text><text x="44" y="668" font-size="13" fill="#9eb2bf">/bm 打开工具箱</text><text x="44" y="695" font-size="13" fill="#9eb2bf">拖动顶栏移动窗口</text><text x="44" y="722" font-size="13" fill="#9eb2bf">Esc 关闭</text><text x="258" y="126" font-size="11" fill="#32d6b0">MODULE SETTINGS</text><text x="258" y="164" font-size="28" fill="#edf5f7">快捷按钮</text><rect x="918" y="133" width="150" height="34" rx="7" fill="#1b2b36" stroke="#304550"/><text x="941" y="156" font-size="15" fill="#32d6b0">模块已启用</text><text x="258" y="210" font-size="15" fill="#9eb2bf">坐骑按用途绑定，内容与外观布局分开编辑。</text><rect x="258" y="232" width="174" height="38" rx="7" fill="#1b2b36" stroke="#304550"/><text x="278" y="257" font-size="15" fill="#32d6b0">坐骑绑定</text><rect x="444" y="232" width="174" height="38" rx="7" fill="#1b2b36" stroke="#304550"/><text x="464" y="257" font-size="15" fill="#edf5f7">外观与布局</text><rect x="630" y="232" width="174" height="38" rx="7" fill="#1b2b36" stroke="#304550"/><text x="650" y="257" font-size="15" fill="#edf5f7">扩展内容</text><rect x="816" y="232" width="174" height="38" rx="7" fill="#1b2b36" stroke="#304550"/><text x="836" y="257" font-size="15" fill="#edf5f7">使用帮助</text><rect x="264" y="267" width="162" height="3" fill="#32d6b0"/><rect x="258" y="292" width="152" height="36" rx="7" fill="#1b2b36" stroke="#304550"/><text x="308" y="316" font-size="15" fill="#32d6b0">飞行</text><rect x="422" y="292" width="152" height="36" rx="7" fill="#1b2b36" stroke="#304550"/><text x="472" y="316" font-size="15" fill="#edf5f7">修理</text><rect x="586" y="292" width="152" height="36" rx="7" fill="#1b2b36" stroke="#304550"/><text x="636" y="316" font-size="15" fill="#edf5f7">拍卖行</text><rect x="750" y="292" width="152" height="36" rx="7" fill="#1b2b36" stroke="#304550"/><text x="800" y="316" font-size="15" fill="#edf5f7">载人</text><rect x="914" y="292" width="152" height="36" rx="7" fill="#1b2b36" stroke="#304550"/><text x="964" y="316" font-size="15" fill="#edf5f7">水下</text><rect x="258" y="348" width="810" height="185" rx="7" fill="#1b2b36" stroke="#304550"/><text x="280" y="384" font-size="18" fill="#32d6b0">飞行坐骑</text><text x="280" y="420" font-size="15" fill="#edf5f7">使用方式：左键点击游戏中的主坐骑按钮。</text><text x="280" y="454" font-size="16" fill="#9eb2bf">飞行：随机收藏坐骑</text><rect x="280" y="479" width="136" height="34" rx="7" fill="#1b2b36" stroke="#304550"/><text x="305" y="502" font-size="15" fill="#edf5f7">设为当前</text><rect x="430" y="479" width="100" height="34" rx="7" fill="#1b2b36" stroke="#304550"/><text x="463" y="502" font-size="15" fill="#edf5f7">清除</text><rect x="258" y="553" width="810" height="115" rx="7" fill="#1b2b36" stroke="#304550"/><text x="280" y="589" font-size="18" fill="#32d6b0">名称或 mountID</text><rect x="280" y="609" width="766" height="36" rx="7" fill="#101a22" stroke="#304550"/><text x="294" y="633" font-size="14" fill="#9eb2bf">填写坐骑名称或 mountID，也可骑上坐骑后「设为当前」</text><text x="258" y="710" font-size="14" fill="#9eb2bf">按用途分页 · 独立模块开关 · 明暗主题 · 保留已有配置</text><text x="28" y="795" font-size="14" fill="#9eb2bf">界面示意预览 · 根据 v1.8.3 功能绘制，非游戏实拍；实际排版以游戏内为准。</text></g></svg>